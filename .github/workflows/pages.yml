name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # deploy-pages (v4 and later) reads the uploaded artifact's metadata; without it the deploy fails with "Fetching artifact metadata failed"
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node testdata/fetch-public.mjs || echo "public files unavailable; those tests will be skipped"
      - run: node --test tests/*.test.mjs
      - name: Random-click stress test
        run: npm ci --prefix tools/monkey && node tools/monkey/monkey.mjs 1500 1
      - uses: actions/configure-pages@v6
      - name: Stamp file versions so browsers load the new files after each deploy
        run: node tools/stamp.mjs _site "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v5 # skips hidden files (dotfiles); the site has none
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v5
